# Build plan for Nixpacks (Dokploy).
#
# Nixpacks detects Bun from bun.lock and installs it; these phases pin the
# production environment and make the build explicit rather than inferred.
# The build step emits the browser bundle into public/, which the server serves.

[variables]
NODE_ENV = "production"

# Nixpacks auto-detects a Node.js package alongside Bun for JS projects, but
# this project is pure Bun and doesn't need it. Pinning setup to just "bun"
# avoids pulling in a nodejs_XX package that may have been removed/EOL'd from
# the pinned nixpkgs snapshot (e.g. nodejs_18 as of late 2025).
[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bun run start"