# Build plan for Nixpacks (Dokploy).
#
# Nixpacks detects Bun from bun.lock and installs it; these phases pin the
# production environment and make the build explicit rather than inferred.
# The build step emits the browser bundle into public/, which the server serves.

[variables]
NODE_ENV = "production"

# Nixpacks auto-detects a Node.js package alongside Bun for JS projects, but
# this project is pure Bun and doesn't need it. Pinning setup to just "curl"
# and "unzip" avoids pulling in a nodejs_XX package that may have been
# removed/EOL'd from the pinned nixpkgs snapshot (e.g. nodejs_18 as of late
# 2025), and avoids nixpkgs' own "bun" package below.
#
# We don't use nixpkgs' "bun" package: it's pinned to whatever Bun version
# was current when this nixpkgs snapshot was cut (e.g. 1.3.0), which lags
# upstream Bun releases. bun.lock's lockfileVersion has moved forward since
# then, so an older Bun fails to parse a lockfile generated by a newer local
# Bun ("Unknown lockfile version") and --frozen-lockfile then aborts the
# build. Installing Bun via the official installer keeps the build on a
# current release that can read the lockfile.
[phases.setup]
nixPkgs = ["curl", "unzip"]

[phases.install]
cmds = [
  "curl -fsSL https://bun.sh/install | bash",
  "ln -sf /root/.bun/bin/bun /usr/local/bin/bun",
  "ln -sf /root/.bun/bin/bunx /usr/local/bin/bunx",
  "bun install --frozen-lockfile",
]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bun run start"